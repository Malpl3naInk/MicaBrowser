plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moling.micabrowser'
    compileSdk 33

    defaultConfig {
        applicationId "com.moling.micabrowser"
        minSdk 26
        // CrossWalk 23 opens /dev/ashmem directly, blocked for modern target SDKs.
        targetSdk (providers.gradleProperty('legacyCrosswalk').getOrElse('false').toBoolean() ? 28 : 33)
        versionCode 5
        versionName "Rel-AL 0.5"
        resConfigs 'en','cn'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

    }

    buildTypes {
        debug {
            applicationIdSuffix ".indev"
            versionNameSuffix '-indev'
            debuggable true
            jniDebuggable true
            manifestPlaceholders = [app_icon: "@mipmap/ic_launcher"]
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters  'armeabi-v7a'
            }
            manifestPlaceholders = [app_icon: "@mipmap/ic_launcher_debug"]
        }
    }
    buildFeatures {
        viewBinding true
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    // Default
    implementation 'com.google.android.gms:play-services-wearable:18.0.0'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.wear:wear:1.2.0'
    // Microsoft AppCenter
    def appCenterSdkVersion = '4.4.5'
    implementation "com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}"
    implementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"
    // CrossWalk
    implementation fileTree(dir: 'libs', include: ['xwalk_core_library-23.53.589.4.aar'])
    // CrossWalk calls junit.framework.Assert at runtime; Wear OS 4 does not ship it.
    implementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    // Room
    def room_version = "2.5.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    // FastJson
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.25'
}
